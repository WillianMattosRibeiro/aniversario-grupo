<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Aniversariantes do Grupo de Whatsapp</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-yellow-50 min-h-screen">
    
    <!-- HEADER -->
    <nav class="bg-white/90 backdrop-blur-xl border-b border-pink-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-x-4">
                <div class="w-14 h-14 bg-gradient-to-br from-pink-500 via-purple-500 to-yellow-400 rounded-2xl flex items-center justify-center shadow-lg">
                    <span class="text-white text-4xl">🎂</span>
                </div>
                <div>
                    <h1 class="title-font text-3xl font-extrabold bg-gradient-to-r from-pink-600 to-purple-600 bg-clip-text text-transparent tracking-tighter">Aniversariantes</h1>
                    <p class="text-[10px] text-pink-600/80 -mt-1 font-medium tracking-[1.5px]">DO GRUPO DE WHATSAPP</p>
                </div>
            </div>
            
            <div class="flex items-center gap-x-3">
                <div class="hidden md:flex items-center bg-white px-4 py-2 rounded-2xl border border-pink-100 shadow-sm">
                    <i class="fa-regular fa-calendar text-pink-500 mr-2"></i>
                    <span id="currentDateHeader" class="text-sm font-semibold text-gray-700"></span>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-5 pt-8 pb-16">
        
        <!-- HERO / STATUS -->
        <div id="statusSection" class="mb-10"></div>

        <!-- CALENDAR SECTION -->
        <div class="mb-10">
            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-y-3 mb-5 px-1">
                <div>
                    <h2 class="section-title text-gray-900 flex items-center gap-x-3">
                        <span>📅</span> 
                        <span>Calendário de Aniversários</span>
                    </h2>
                    <p class="text-gray-500 text-sm mt-1">Clique nos dias destacados para ver os detalhes</p>
                </div>
                
                <div class="flex items-center gap-x-2">
                    <button onclick="prevMonth()" class="w-11 h-11 flex items-center justify-center bg-white hover:bg-pink-50 border border-pink-100 text-pink-600 rounded-2xl transition-colors shadow-sm active:scale-95">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    
                    <div class="px-6 py-2.5 bg-white border border-pink-100 rounded-2xl shadow-sm min-w-[170px] text-center">
                        <span id="calendarTitle" class="font-bold text-xl text-gray-800"></span>
                    </div>
                    
                    <button onclick="nextMonth()" class="w-11 h-11 flex items-center justify-center bg-white hover:bg-pink-50 border border-pink-100 text-pink-600 rounded-2xl transition-colors shadow-sm active:scale-95">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    
                    <button onclick="goToToday()" class="ml-1 px-5 py-2.5 text-sm font-semibold bg-white hover:bg-yellow-50 border border-yellow-200 text-yellow-600 rounded-2xl transition-all flex items-center gap-x-2 shadow-sm active:scale-95">
                        <i class="fa-solid fa-calendar-day"></i>
                        <span class="hidden md:inline">Hoje</span>
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-xl border border-pink-100 p-6 md:p-8 modern-shadow">
                <div class="grid grid-cols-7 gap-2 mb-3 px-2">
                    <div class="text-center text-xs font-bold text-pink-400/90 tracking-widest py-1">DOM</div>
                    <div class="text-center text-xs font-bold text-pink-400/90 tracking-widest py-1">SEG</div>
                    <div class="text-center text-xs font-bold text-pink-400/90 tracking-widest py-1">TER</div>
                    <div class="text-center text-xs font-bold text-pink-400/90 tracking-widest py-1">QUA</div>
                    <div class="text-center text-xs font-bold text-pink-400/90 tracking-widest py-1">QUI</div>
                    <div class="text-center text-xs font-bold text-pink-400/90 tracking-widest py-1">SEX</div>
                    <div class="text-center text-xs font-bold text-pink-400/90 tracking-widest py-1">SÁB</div>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
            </div>
        </div>

        <!-- NEXT + FULL LIST -->
        <div class="grid lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5">
                <div class="bg-white border border-pink-100 rounded-3xl p-7 shadow-xl h-full modern-shadow">
                    <div class="flex items-center gap-x-3 mb-4">
                        <div class="px-4 py-1.5 bg-gradient-to-r from-pink-500 to-purple-500 text-white text-xs font-bold tracking-widest rounded-2xl flex items-center gap-x-2">
                            <i class="fa-solid fa-clock"></i>
                            <span>PRÓXIMO</span>
                        </div>
                    </div>
                    <div id="proximoContent"></div>
                </div>
            </div>
            
            <div class="lg:col-span-7">
                <div class="flex items-center justify-between mb-4 px-1">
                    <h3 class="font-bold text-2xl text-gray-800 flex items-center gap-x-3">
                        <span>🎁</span> 
                        <span>Todos os Aniversariantes</span>
                    </h3>
                    <span class="text-xs px-3 py-1 bg-pink-100 text-pink-600 font-medium rounded-2xl">Ordenados por proximidade</span>
                </div>
                
                <div id="listaAniversariantes" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 max-h-[380px] overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <!-- DAY DETAIL MODAL -->
    <div id="dayModal" onclick="if (event.target.id === 'dayModal') closeDayModal()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div onclick="event.stopImmediatePropagation()" class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden modal">
            <div class="bg-gradient-to-r from-pink-500 to-purple-600 px-7 py-5 flex items-center justify-between">
                <div class="flex items-center gap-x-3 text-white">
                    <i class="fa-solid fa-birthday-cake text-3xl"></i>
                    <div>
                        <div class="font-bold text-xl">Aniversário!</div>
                        <div id="modalDate" class="text-pink-100 text-sm"></div>
                    </div>
                </div>
                <button onclick="closeDayModal()" class="text-white/80 hover:text-white transition-colors text-3xl leading-none">&times;</button>
            </div>
            
            <div class="p-7">
                <div id="modalNames" class="text-center"></div>
                <div class="mt-6 flex justify-center">
                    <!-- <button onclick="openCelebrationModal()" class="flex items-center justify-center gap-x-3 px-8 py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:brightness-105 text-white font-bold rounded-2xl shadow-lg active:scale-[0.985] transition-all text-sm">
                        <i class="fa-solid fa-play mr-1"></i> 
                        <span>TOCAR PARABÉNS</span>
                    </button> -->
                </div>
            </div>
        </div>
    </div>

    <!-- VIDEO PLAYER MODAL -->
    <div id="playerModal" onclick="if (event.target.id === 'playerModal') closePlayerModal()" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md z-[110] flex items-center justify-center p-4">
        <div onclick="event.stopImmediatePropagation()" class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden modal">
            
            <div class="px-6 py-4 bg-gradient-to-r from-pink-600 to-purple-700 flex items-center justify-between text-white">
                <div class="flex items-center gap-x-3">
                    <i class="fa-solid fa-music text-2xl"></i>
                    <div>
                        <div id="modalPlayerTitle" class="font-extrabold text-xl tracking-tight">Parabéns!</div>
                        <div class="text-pink-200 text-xs -mt-0.5">Feliz Aniversário</div>
                    </div>
                </div>
                <button onclick="closePlayerModal()" class="text-white/70 hover:text-white text-3xl leading-none w-9 h-9 flex items-center justify-center">&times;</button>
            </div>
            
            <div class="bg-black aspect-video">
                <video id="celebrationVideo" class="w-full h-full" controls autoplay playsinline></video>
            </div>
            
            <div class="px-6 py-4 bg-gray-50 flex items-center justify-center gap-x-2 text-sm">
                <div class="flex items-center text-pink-600">
                    <i class="fa-solid fa-heart mr-1.5"></i>
                    <span class="font-medium">Celebre esse momento especial!</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
